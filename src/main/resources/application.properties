# ResortsLite - Cloud-Ready Configuration for AWS
spring.application.name=ResortsLite

# FIXED cr-java-0077: Port now configurable via environment variable (ECS/EKS dynamic port assignment)
server.port=${SERVER_PORT:8080}

# Database Configuration - FIXED cr-java-0069: Credentials externalized to AWS Secrets Manager
# Connection details retrieved at runtime from Secrets Manager
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# FIXED cr-java-0065, cr-java-0067: Redis configuration for distributed session and cache management
# Amazon ElastiCache for Redis endpoint
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:true}
spring.redis.timeout=2000ms

# Spring Session configuration - store sessions in Redis
spring.session.store-type=redis
spring.session.redis.namespace=resorts:session
spring.session.timeout=24h

# FIXED cr-java-0071: Service endpoints externalized to AWS Systems Manager Parameter Store
# Retrieved at runtime from Parameter Store for environment-specific configuration
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# FIXED cr-java-0061, cr-java-0062, cr-java-0063: S3 bucket configuration for file storage
# All file operations now use Amazon S3 instead of local file system
aws.s3.reports.bucket=${S3_REPORTS_BUCKET:resorts-reports-bucket}
aws.s3.backups.bucket=${S3_BACKUPS_BUCKET:resorts-backups-bucket}
aws.region=${AWS_REGION:us-east-1}

# FIXED cr-java-0069, cr-java-0090: AWS Secrets Manager configuration
aws.secrets.database.name=${DB_SECRET_NAME:resorts-db-credentials}
aws.secrets.user.name=${USER_SECRET_NAME:resorts-user-credentials}

# FIXED cr-java-0071: Report download URL externalized
app.reports.base.url=${REPORTS_BASE_URL:https://reports.resorts-internal.com}

# Logging configuration - structured JSON logging for cloud monitoring
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# FIXED cr-java-0111: Timezone standardization - all timestamps in UTC
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
