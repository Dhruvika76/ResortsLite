# ResortsLite - Cloud-ready Configuration
# Configuration values support AWS Systems Manager Parameter Store via environment variables
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Service Endpoints - Externalized to AWS Systems Manager Parameter Store
# These values should be overridden via environment variables in cloud deployments:
# - AWS_PAYMENT_ENDPOINT (from AWS SSM Parameter Store)
# - AWS_INVENTORY_ENDPOINT (from AWS SSM Parameter Store)
# - AWS_NOTIFICATION_ENDPOINT (from AWS SSM Parameter Store)
# - AWS_REPORTS_DOWNLOAD_BASEURL (from AWS SSM Parameter Store)
app.payment.endpoint=${AWS_PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${AWS_INVENTORY_ENDPOINT:http://inventory-svc.internal:8081}
app.notification.endpoint=${AWS_NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}

# Report Download Base URL - Externalized to AWS Systems Manager Parameter Store
app.reports.download.baseurl=${AWS_REPORTS_DOWNLOAD_BASEURL:https://reports.resorts-internal.com/download}

# AWS S3 Configuration for cloud-native file storage
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:resort-reports-bucket}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.reports.prefix=reports/
aws.s3.backups.prefix=backups/

# Spring Session Data Redis Configuration for Amazon ElastiCache
# FIXED cr-java-0065: Migrated HTTP session storage to Amazon ElastiCache for Redis
# This enables stateless application instances with centralized, distributed session management
spring.session.store-type=redis
spring.session.redis.namespace=spring:session
spring.session.timeout=1800s

# Redis/ElastiCache connection configuration (externalized for cloud deployment)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
